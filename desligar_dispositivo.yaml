blueprint:
  name: Desligar dispositivo após acionamento com notificações
  description: >
    Quando um dispositivo for acionado (ligado), envia uma notificação,
    aguarda um período configurável, desliga o dispositivo e envia
    uma nova notificação informando o desligamento.
  domain: automation
  input:
    dispositivo:
      name: Dispositivo
      description: O dispositivo (switch, light, etc.) a ser monitorado e desligado.
      selector:
        entity:
          domain:
            - switch
            - light
            - fan
            - input_boolean
    tempo_espera:
      name: Tempo de espera
      description: Período de tempo a aguardar antes de desligar o dispositivo.
      default:
        hours: 0
        minutes: 30
        seconds: 0
      selector:
        duration: {}
    dispositivo_notificacao:
      name: Serviço de notificação
      description: O serviço de notificação (ex. notify.mobile_app_seu_celular).
      default: notify.notify
      selector:
        text: {}

mode: single
max_exceptions: 0

trigger:
  - platform: state
    entity_id: !input dispositivo
    to: "on"

variables:
  dispositivo: !input dispositivo
  servico_notificacao: !input dispositivo_notificacao
  nome_dispositivo: "{{ state_attr(dispositivo, 'friendly_name') or dispositivo }}"

action:
  - service: "{{ servico_notificacao }}"
    data:
      title: "Dispositivo acionado"
      message: "O dispositivo '{{ nome_dispositivo }}' foi acionado."

  - delay: !input tempo_espera

  - service: homeassistant.turn_off
    target:
      entity_id: !input dispositivo

  - service: "{{ servico_notificacao }}"
    data:
      title: "Dispositivo desligado"
      message: "O dispositivo '{{ nome_dispositivo }}' foi desligado."
